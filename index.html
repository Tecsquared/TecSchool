  :root {
    --tec-blue:    #1DB2FF;
    --tec-yellow:  #FED501;
    --tec-pink:    #FF208D;
    --tec-ink:     #1A1A1A;
    --tec-bg:      #F4F2EC;

    /* Soft panel tints — pastels of the three brand colours over the cream base */
    --thai-tint:    #CCDDF4;
    --eng-tint:     #F4E9BC;
    --chi-tint:     #F8D3E1;

    /* Slightly deeper tints for the seams / hover pre-state */
    --thai-deep:    #C9DBF2;
    --eng-deep:     #F0E4A6;
    --chi-deep:     #F7C9DC;

    /* Darker gold for small English text that must stay legible on the yellow panel */
    --eng-gold:     #C99B00;

    --card-shadow: 0 18px 40px rgba(20, 18, 12, 0.14), 0 4px 12px rgba(20, 18, 12, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--tec-bg);
    color: var(--tec-ink);
    font-family: 'Roboto', system-ui, -apple-system, Segoe UI, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body {
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* ============================================================
     STAGE — three full-height panels ("three doors")
     Desktop: side-by-side, English centre panel a touch wider.
     ============================================================ */
  .stage {
    position: relative;
    min-height: 100dvh;
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
  }

  /* ---------- A panel is the whole tappable "door" ---------- */
  .panel {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(18px, 2.4vw, 34px);
    padding: clamp(320px, 45vh, 380px) clamp(16px, 3vw, 40px) clamp(64px, 9vh, 110px);
    text-decoration: none;
    color: inherit;
    -webkit-tap-highlight-color: transparent;
    transition: background-color 420ms ease;
    opacity: 0;
    transform: translateY(18px);
    animation: panelIn 720ms cubic-bezier(.2,.8,.25,1) forwards;
  }
  .panel-thai    { background: var(--thai-tint); animation-delay: 120ms; }
  .panel-english { background: var(--eng-tint);  animation-delay: 220ms; }
  .panel-chinese { background: var(--chi-tint);  animation-delay: 320ms; }

  @keyframes panelIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Greeting (the hero of each door) ---------- */
  .greeting {
    font-family: "chaloops", "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    line-height: 0.95;
    font-size: clamp(56px, 8.5vw, 132px);
    letter-spacing: -0.01em;
    text-shadow: 4px 5px 0 rgba(0,0,0,0.07);
    transition: transform 420ms cubic-bezier(.2,.8,.25,1), color 420ms ease;
  }
  .panel-thai    .greeting { color: var(--tec-blue); }
  .panel-english .greeting {
    color: var(--tec-yellow);
    /* Thin ink stroke keeps the yellow readable on the pale-yellow panel
       (same treatment as the E in the wordmark). */
    -webkit-text-stroke: 2.5px var(--tec-ink);
    paint-order: stroke fill;
  }
  .panel-chinese .greeting { color: var(--tec-pink); }

  /* ---------- Language label ---------- */
  .lang {
    font-family: "chaloops", "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(18px, 2vw, 28px);
    letter-spacing: 0.01em;
  }
  /* Deeper hue-matched shades so the small labels stay legible on the tints */
  .panel-thai    .lang { color: #0B63A0; }
  .panel-english .lang { color: #806200; }
  .panel-chinese .lang { color: #BA0E63; }

  /* ---------- Circular arrow affordance ---------- */
  .go {
    width: clamp(52px, 5vw, 72px);
    height: clamp(52px, 5vw, 72px);
    border-radius: 50%;
    border: 2.5px solid currentColor;
    display: grid;
    place-items: center;
    transition: background-color 320ms ease, color 320ms ease, transform 320ms ease;
  }
  .go svg { width: 44%; height: 44%; display: block; }
  .panel-thai    .go { color: #0C6BAE; }
  .panel-english .go { color: #806200; }
  .panel-chinese .go { color: #C60F69; }

  /* ---------- Hover / focus: the door "opens" — deepen to brand colour ---------- */
  @media (hover: hover) {
    .panel-thai:hover    { background: var(--tec-blue); }
    .panel-english:hover { background: var(--tec-yellow); }
    .panel-chinese:hover { background: var(--tec-pink); }

    .panel:hover .greeting { transform: scale(1.04); }
    .panel:hover .go       { transform: scale(1.08); }

    /* Thai + Chinese flip to white text; English stays ink on yellow */
    .panel-thai:hover    .greeting,
    .panel-thai:hover    .lang,
    .panel-chinese:hover .greeting,
    .panel-chinese:hover .lang { color: #fff; }
    .panel-thai:hover    .greeting,
    .panel-chinese:hover .greeting { -webkit-text-stroke: 0; }

    .panel-thai:hover    .go,
    .panel-chinese:hover .go { color: #fff; }
    .panel-thai:hover    .go { background: rgba(255,255,255,0.16); }
    .panel-chinese:hover .go { background: rgba(255,255,255,0.16); }

    .panel-english:hover .greeting { color: var(--tec-ink); -webkit-text-stroke: 0; }
    .panel-english:hover .lang,
    .panel-english:hover .go { color: var(--tec-ink); }
    .panel-english:hover .go { background: rgba(0,0,0,0.06); }
  }

  .panel:focus-visible {
    outline: 3px solid var(--tec-ink);
    outline-offset: -6px;
  }

  /* ---------- English-panel credential note (bottom) ---------- */
  .eng-note {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: min(92%, 460px);
    color: var(--tec-ink);
    pointer-events: none;
    bottom: clamp(118px, 17vh, 168px);
    font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: clamp(13px, 1.3vw, 16px);
    color: var(--tec-ink);
    opacity: 0.78;
  }

  /* ============================================================
     HERO CARD — floating T·E·C identity, overlaps all three doors
     ============================================================ */
  .hero-card {
    position: absolute;
    top: clamp(24px, 5vh, 60px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    width: min(94vw, 760px);
    background: #FBFAF6;
    border-radius: clamp(24px, 2.6vw, 36px);
    box-shadow: var(--card-shadow);
    padding: clamp(24px, 3.2vw, 44px) clamp(28px, 4.6vw, 68px) clamp(26px, 3.4vw, 42px);
    text-align: center;
    opacity: 0;
    transform: translate(-50%, -14px);
    animation: cardIn 700ms cubic-bezier(.2,.85,.25,1.05) 80ms forwards;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translate(-50%, 0); }
  }

  /* T · E · C wordmark */
  .tec {
    font-family: "chaloops", "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    line-height: 0.9;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: clamp(12px, 1.8vw, 22px);
    user-select: none;
  }
  .tec .letter {
    display: inline-block;
    font-size: clamp(62px, 8.4vw, 140px);
    line-height: 0.85;
    letter-spacing: -0.02em;
    text-shadow: 5px 6px 0 rgba(0,0,0,0.10);
  }
  .tec .t { color: var(--tec-blue); }
  .tec .e {
    color: var(--tec-yellow);
    -webkit-text-stroke: 3px var(--tec-ink);
    paint-order: stroke fill;
  }
  .tec .c { color: var(--tec-pink); }
  .tec .sep {
    width: clamp(9px, 1vw, 14px);
    height: clamp(9px, 1vw, 14px);
    background: var(--tec-ink);
    border-radius: 50%;
    flex: none;
  }

  .headline {
    font-family: "chaloops", "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    color: var(--tec-ink);
    font-size: clamp(40px, 5.8vw, 84px);
    line-height: 1;
    margin-top: clamp(8px, 1.2vw, 16px);
  }

  /* ============================================================
     BOTTOM STRIP — school descriptor + trust stamp, moved out of
     the card so the T·E·C identity can breathe bigger up top.
     ============================================================ */
  .site-foot {
    position: absolute;
    left: 50%;
    bottom: clamp(16px, 3vh, 32px);
    transform: translateX(-50%);
    z-index: 4;
    width: min(94vw, 640px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(6px, 1vw, 10px);
    text-align: center;
    pointer-events: none;
    opacity: 0;
    animation: footIn 700ms ease 520ms forwards;
  }
  @keyframes footIn { to { opacity: 1; } }

  .foot-sub {
    font-family: 'Roboto', sans-serif;
    font-weight: 500;
    font-size: clamp(14px, 1.5vw, 19px);
    line-height: 1.35;
    color: var(--tec-ink);
    opacity: 0.9;
  }

  /* Handwritten trust badge with painterly underline */
  .trust-note {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .trust-note .text {
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(19px, 2.1vw, 28px);
    color: var(--tec-ink);
    line-height: 1;
    white-space: nowrap;
  }
  .trust-note .underline {
    display: block;
    width: 82%;
    height: clamp(6px, 0.7vw, 9px);
    margin-top: -1px;
    overflow: visible;
  }

  /* ============================================================
     SHORT LAPTOP VIEWPORTS (landscape, height-constrained) —
     make the card compact and size type by height so the whole
     gate still fits one screen without the card colliding.
     ============================================================ */
  @media (min-width: 761px) and (max-height: 780px) {
    .hero-card {
      top: clamp(14px, 3vh, 30px);
      padding: clamp(14px, 2.2vh, 26px) clamp(24px, 4vw, 52px) clamp(16px, 2.4vh, 26px);
    }
    .tec .letter { font-size: clamp(48px, 10.5vh, 96px); }
    .tec .e { -webkit-text-stroke-width: 2.5px; }
    .headline { font-size: clamp(28px, 6.8vh, 56px); }
    .panel { padding-top: clamp(210px, 38vh, 290px); padding-bottom: clamp(48px, 8vh, 80px); }
    .greeting { font-size: clamp(48px, 12vh, 104px); }
    .go { width: clamp(46px, 8vh, 64px); height: clamp(46px, 8vh, 64px); }
    .eng-note { bottom: clamp(96px, 15vh, 150px); }
    .site-foot { bottom: clamp(12px, 2.4vh, 26px); }
    .foot-sub { font-size: clamp(13px, 2vh, 17px); }
  }

  /* Landscape phones: the viewport is too short for the bottom-anchored
     Cambridge note — it rides up between the wordmark and the arrow. Let
     it flow under the arrow, as in the portrait-mobile layout. */
  @media (min-width: 761px) and (max-height: 500px) {
    .eng-note {
      position: static;
      transform: none;
      width: auto;
      margin-top: 4px;
    }
  }

  /* ============================================================
     MOBILE — the three doors become three stacked bands,
     the card sits above them in normal flow.
     ============================================================ */
  @media (max-width: 760px) {
    .stage {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
    }
    .hero-card {
      position: static;
      transform: none;
      width: auto;
      margin: clamp(12px, 3.4vw, 22px) clamp(14px, 4vw, 24px) clamp(8px, 2.6vw, 14px);
      animation: cardInMobile 600ms ease 60ms both;
    }
    @keyframes cardInMobile {
      from { opacity: 0; transform: translateY(-10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .panel {
      flex: 1 1 0;
      min-height: clamp(150px, 21vh, 220px);
      padding: clamp(18px, 4.5vw, 32px) 20px;
      gap: clamp(6px, 2vw, 12px);
      transform: translateY(12px);
    }
    .greeting { font-size: clamp(48px, 14vw, 84px); }
    .go { width: clamp(44px, 11vw, 54px); height: clamp(44px, 11vw, 54px); }
    .eng-note {
      position: static;
      transform: none;
      width: auto;
      margin-top: 4px;
    }
    .site-foot {
      position: static;
      transform: none;
      width: auto;
      margin: clamp(10px, 3vw, 18px) 16px clamp(12px, 4vw, 20px);
      animation: none;
      opacity: 1;
    }
    /* On touch, keep the coloured-text-on-tint look (no hover state) */
  }

  /* ---------- Reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    .panel, .hero-card, .site-foot {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
    .hero-card { transform: translateX(-50%) !important; }
    .site-foot { transform: translateX(-50%) !important; }
    @media (max-width: 760px) {
      .hero-card, .site-foot { transform: none !important; }
    }
    .greeting, .go { transition: none !important; }
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
